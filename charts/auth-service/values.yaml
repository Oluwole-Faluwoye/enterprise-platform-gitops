# =========================================================
# GLOBAL
# =========================================================

global:
  project: enterprise-platform
  environment: dev
replicaCount: 2
# =========================================================
# IMAGE
# =========================================================
image:
  repository: ""
  pullPolicy: Always
  tag: ""
imagePullSecrets: []
# =========================================================
# APPLICATION
# =========================================================
application:
  port: 8080
  profile: dev
# =========================================================
# APPLICATION SECRETS
# =========================================================
secrets:
  application:
    kubernetesSecret: auth-service-app-secret
env:
  - name: JWT_SECRET
    secretName: auth-service-app-secret
    secretKey: jwt-secret
# =========================================================
# DATABASE
# =========================================================
database:
  enabled: false
  host: ""
  port: 5432
  name: ""
  credentialReference: ""
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels:
  app: auth-service
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/group.name: enterprise-platform
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:761018849945:certificate/338c9fc3-b625-484b-a3a3-af14627964d1
  hosts:
    - host: api.dev.dreammyles.online
      paths:
        - path: /
          pathType: Prefix
httpRoute:
  enabled: false
resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
health:
  path: /actuator/health

startupProbe:
  httpGet:
    path: /actuator/health
    port: http
  failureThreshold: 30
  periodSeconds: 5
  timeoutSeconds: 2

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
    
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
serviceMonitor:
  enabled: true
  labels:
    release: prometheus-stack
  interval: 15s
  path: /actuator/prometheus
