global:
  resolve_timeout: 5m

templates:
  - "/etc/alertmanager/configmaps/alertmanager-templates/*.tmpl"

route:
  receiver: default

  group_by:
    - alertname
    - namespace
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

  routes:
    - matchers:
        - severity="critical"
      receiver: platform-email

    - matchers:
        - severity="warning"
      receiver: platform-email

    - matchers:
        - severity="info"
      receiver: default

receivers:
  - name: default

  - name: platform-email
    email_configs:
      - to: "{{ .Values.alertmanager.smtp.to }}"
        from: "{{ .Values.alertmanager.smtp.from }}"
        smarthost: "{{ .Values.alertmanager.smtp.host }}:{{ .Values.alertmanager.smtp.port }}"
        auth_username: "{{ .Values.alertmanager.smtp.username }}"
        auth_password_file: "/etc/alertmanager/secrets/alertmanager-secret/smtp-password"
        require_tls: true
        send_resolved: true

        headers:
          Subject: '{{ "{{ template \"email.subject\" . }}" }}'

        text: '{{ "{{ template \"email.body\" . }}" }}'

inhibit_rules:
  - source_matchers:
      - severity="critical"

    target_matchers:
      - severity="warning"

    equal:
      - namespace
      - alertname