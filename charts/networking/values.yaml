# =========================================================
# GLOBAL
# =========================================================

global:
  namespace: default
  domain: dev.dreammyles.online
# =========================================================
# AWS
# =========================================================
aws:
  region: us-east-1
  accountId: "761018849945"
# =========================================================
# ALB
# =========================================================
alb:
  ingressClass: alb
  groupName: enterprise-platform
  scheme: internet-facing
  targetType: ip
  certificateArn: "arn:aws:acm:us-east-1:761018849945:certificate/4a65bfaf-a065-416b-9606-ed6f6e09d4ec"
# =========================================================
# HOSTS
# =========================================================
hosts:
  auth:
    enabled: true
    hostname: api.dev.dreammyles.online
    service:
      name: auth-service
      port: 8080
  grafana:
    enabled: true
    hostname: grafana.dev.dreammyles.online
    service:
      name: kube-prometheus-stack-grafana
      port: 80
  argocd:
    enabled: true
    hostname: argocd.dev.dreammyles.online
    service:
      name: argocd-server
      port: 80
tls:
  enabled: false
  issuer:
    name: letsencrypt-prod
    email: admin@dreammyles.online
    server: https://acme-v02.api.letsencrypt.org/directory
