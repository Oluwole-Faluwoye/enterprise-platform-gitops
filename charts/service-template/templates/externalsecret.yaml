{{- if and .Values.secrets.enabled .Values.secrets.external.enabled }}

{{- if not .Values.service.name }}
{{- fail "service.name is required when external secrets are enabled" }}
{{- end }}

{{- if not .Values.secrets.external.data }}
{{- fail "secrets.external.data must contain at least one secret mapping when external secrets are enabled" }}
{{- end }}

apiVersion: external-secrets.io/v1

kind: ExternalSecret

metadata:
  name: {{ include "service-template.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}

spec:
  refreshInterval: {{ .Values.secrets.external.refreshInterval | default "1h" }}

  secretStoreRef:
    name: {{ .Values.secrets.external.secretStore.name | default "aws-secretsmanager" }}
    kind: ClusterSecretStore

  target:
    name: {{ include "service-template.secretName" . }}
    creationPolicy: Owner

  data:
    {{- range .Values.secrets.external.data }}

    {{- if not .secretKey }}
    {{- fail "each external secret data entry requires secretKey" }}
    {{- end }}

    {{- if not .property }}
    {{- fail "each external secret data entry requires property" }}
    {{- end }}

    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ include "service-template.awsSecretPath" $ }}
        property: {{ .property }}

    {{- end }}

{{- end }}