{{- if and .Values.securityGroupPolicy.enabled .Values.securityGroupPolicy.groupId }}
apiVersion: vpcresources.k8s.aws/v1beta1
kind: SecurityGroupPolicy
metadata:
  name: {{ include "service-template.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-template.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "service-template.selectorLabels" . | nindent 6 }}
  securityGroups:
    groupIds:
      - {{ .Values.securityGroupPolicy.groupId | quote }}
{{- end }}