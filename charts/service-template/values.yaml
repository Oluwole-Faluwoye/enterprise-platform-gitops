# =========================================================
# GLOBAL
# =========================================================

global:
  project: enterprise-platform
  environment: dev

# =========================================================
# SERVICE
# =========================================================

service:
  name: ""
  type: ClusterIP
  port: 8080

# =========================================================
# IMAGE
# =========================================================

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# =========================================================
# APPLICATION
# =========================================================

application:
  port: 8080
  profile: dev

# =========================================================
# REPLICAS
# =========================================================

replicaCount: 2

# =========================================================
# SERVICE ACCOUNT
# =========================================================

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# =========================================================
# DATABASE
# Platform-populated database connection contract
# =========================================================

database:
  enabled: false
  engine: ""
  host: ""
  port: 0
  name: ""
  credentialReference: ""

# =========================================================
# SECURITY GROUP FOR PODS
# =========================================================

securityGroupPolicy:
  enabled: false
  groupId: ""

# =========================================================
# POD
# =========================================================

podAnnotations: {}

podLabels: {}

podSecurityContext: {}

securityContext: {}

# =========================================================
# RESOURCES
# =========================================================

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# =========================================================
# HEALTH
# =========================================================

health:
  enabled: true

livenessProbe:
  httpGet:
    path: /health/live
    port: http

readinessProbe:
  httpGet:
    path: /health/ready
    port: http

# =========================================================
# AUTOSCALING
# =========================================================

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# =========================================================
# INGRESS
# =========================================================

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []

# =========================================================
# MONITORING
# =========================================================

serviceMonitor:
  enabled: true
  labels:
    release: prometheus-stack
  interval: 15s
  path: /metrics

# =========================================================
# ENVIRONMENT
# =========================================================

env: []

# =========================================================
# SECRETS
# =========================================================

secrets:
  enabled: false

  external:
    enabled: false
    refreshInterval: 1h

    secretStore:
      name: aws-secretsmanager

    data: []

# =========================================================
# DATABASE MIGRATION
# =========================================================

migration:
  enabled: false
  engine: ""

  artifact:
    bucket: ""
    key: ""

  image:
    repository: flyway/flyway
    tag: "10.10.0"

  serviceAccount:
    name: ""
    roleArn: ""

  databaseSecret:
    name: ""
    secretStore: aws-secretsmanager
    credentialReference: ""

# =========================================================
# STORAGE
# =========================================================

volumes: []

volumeMounts: []

# =========================================================
# SCHEDULING
# =========================================================

nodeSelector: {}

tolerations: []

affinity: {}

# =========================================================
# NAMING
# =========================================================

nameOverride: ""

fullnameOverride: ""
